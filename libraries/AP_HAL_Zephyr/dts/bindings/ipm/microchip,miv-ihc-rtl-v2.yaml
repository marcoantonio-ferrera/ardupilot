description: Microchip IHC (Inter Hart Communication) mailbox controller

compatible: "microchip,miv-ihc-rtl-v2"

include: base.yaml

properties:
  reg:
    type: array
    description: Address and length of the register set for the device
    required: true

  interrupts-parent:
    type: phandle

child-binding:
  description: IHCM (Inter Hart Communication Module) node

  properties:
    reg:
      type: array
      required: true

    interrupts:
      type: array
      required: true

  child-binding:
    description: IHCC (Inter Hart Communication Channel) node

    properties:
      reg:
        type: array
        required: true
